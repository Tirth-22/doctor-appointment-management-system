name: Build and Push Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Backend JAR
        working-directory: backend
        run: mvn clean package

      - name: Verify JAR
        run: find . -name "*.jar"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/dams-backend-ci:latest \
          ./backend

      - name: Push Backend
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/dams-backend-ci:latest

      - name: Build Frontend
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/dams-frontend-ci:latest \
          ./frontend

      - name: Push Frontend
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/dams-frontend-ci:latest